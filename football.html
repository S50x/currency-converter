<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07120c">
<title>Arcade World Cup ⚽</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07120c;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 30%, #0d2b1a, #07120c 70%);
    color: #eafff2; text-align: center; padding: 24px;
  }
  #rotate .phone {
    width: 46px; height: 78px; border: 3px solid #4ade80; border-radius: 10px;
    animation: spin 1.6s ease-in-out infinite;
  }
  #rotate h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  #rotate p { margin: 0; font-size: 14px; opacity: .7; }
  @keyframes spin {
    0%, 20% { transform: rotate(0deg); }
    55%, 100% { transform: rotate(90deg); }
  }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">
  <div class="phone"></div>
  <h2>ROTATE YOUR DEVICE</h2>
  <p>This game is played in landscape mode</p>
</div>
<script>
'use strict';
/* ============================================================
   ARCADE WORLD CUP — top-down arcade football
   Single-file HTML5 Canvas game. No external assets.
   Modules: Utils, Teams, View, Input, Sound, Particles,
            Tournament, Match (physics + AI), Render, Loop.
   ============================================================ */

/* ---------------- Utils ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const TAU = Math.PI * 2;
// Frame-rate independent smoothing factor.
const damp = (k, dt) => 1 - Math.exp(-k * dt);

function norm(x, y) {
  const l = Math.hypot(x, y);
  return l > 1e-6 ? { x: x / l, y: y / l } : { x: 1, y: 0 };
}
function hexRGB(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function colorDist(a, b) {
  const A = hexRGB(a), B = hexRGB(b);
  return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]);
}
function poisson(lambda) {
  let l = Math.exp(-lambda), k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > l && k < 9);
  return k - 1;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------- Teams ---------------- */
// col: jersey, alt: clash jersey, trim: ring/shorts, str: strength rating
const TEAMS = [
  { code: 'ARG', name: 'Argentina',    col: '#8ec8e8', alt: '#1b2f6e', trim: '#ffffff', str: 93 },
  { code: 'KSA', name: 'Saudi Arabia', col: '#0f7b3f', alt: '#f4f4f4', trim: '#ffffff', str: 78 },
  { code: 'FRA', name: 'France',       col: '#16295c', alt: '#f4f4f4', trim: '#e01e2f', str: 91 },
  { code: 'JPN', name: 'Japan',        col: '#2b58c8', alt: '#f4f4f4', trim: '#ffffff', str: 80 },
  { code: 'BRA', name: 'Brazil',       col: '#ffd400', alt: '#1f4fd0', trim: '#009b3a', str: 92 },
  { code: 'GER', name: 'Germany',      col: '#f4f4f4', alt: '#0e6f5c', trim: '#1a1a1a', str: 87 },
  { code: 'ESP', name: 'Spain',        col: '#c8102e', alt: '#1b2f6e', trim: '#ffd100', str: 88 },
  { code: 'ENG', name: 'England',      col: '#f4f4f4', alt: '#d3273e', trim: '#cf081f', str: 86 },
];
const GK_COLORS = ['#e8b013', '#f97316', '#a855f7', '#14b8a6'];
const ROUND_NAMES = ['QUARTER-FINAL', 'SEMI-FINAL', 'FINAL'];

// Simplified national flags, drawn with canvas primitives.
function drawFlag(c, code, x, y, w, h) {
  c.save();
  roundRect(c, x, y, w, h, Math.min(3, h * 0.12));
  c.clip();
  const f = (col, fx, fy, fw, fh) => { c.fillStyle = col; c.fillRect(x + fx * w, y + fy * h, fw * w, fh * h); };
  switch (code) {
    case 'ARG':
      f('#75aadb', 0, 0, 1, 1); f('#ffffff', 0, 1 / 3, 1, 1 / 3);
      c.fillStyle = '#f6b40e';
      c.beginPath(); c.arc(x + w / 2, y + h / 2, h * 0.14, 0, TAU); c.fill();
      break;
    case 'KSA':
      f('#165d31', 0, 0, 1, 1);
      c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1, h * 0.07); c.lineCap = 'round';
      c.beginPath(); c.moveTo(x + w * 0.2, y + h * 0.38); c.lineTo(x + w * 0.8, y + h * 0.38);
      c.moveTo(x + w * 0.22, y + h * 0.62); c.lineTo(x + w * 0.72, y + h * 0.62); c.stroke();
      break;
    case 'FRA':
      f('#0055a4', 0, 0, 1 / 3, 1); f('#ffffff', 1 / 3, 0, 1 / 3, 1); f('#ef4135', 2 / 3, 0, 1 / 3, 1);
      break;
    case 'JPN':
      f('#ffffff', 0, 0, 1, 1);
      c.fillStyle = '#bc002d';
      c.beginPath(); c.arc(x + w / 2, y + h / 2, h * 0.28, 0, TAU); c.fill();
      break;
    case 'BRA':
      f('#009c3b', 0, 0, 1, 1);
      c.fillStyle = '#ffdf00';
      c.beginPath();
      c.moveTo(x + w * 0.5, y + h * 0.1); c.lineTo(x + w * 0.88, y + h * 0.5);
      c.lineTo(x + w * 0.5, y + h * 0.9); c.lineTo(x + w * 0.12, y + h * 0.5);
      c.closePath(); c.fill();
      c.fillStyle = '#002776';
      c.beginPath(); c.arc(x + w / 2, y + h / 2, h * 0.2, 0, TAU); c.fill();
      break;
    case 'GER':
      f('#111111', 0, 0, 1, 1 / 3); f('#dd0000', 0, 1 / 3, 1, 1 / 3); f('#ffce00', 0, 2 / 3, 1, 1 / 3);
      break;
    case 'ESP':
      f('#aa151b', 0, 0, 1, 1); f('#f1bf00', 0, 0.25, 1, 0.5);
      break;
    case 'ENG':
      f('#ffffff', 0, 0, 1, 1);
      f('#ce1124', 0, 0.4, 1, 0.2); f('#ce1124', 0.4, 0, 0.2, 1);
      break;
  }
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.35)';
  c.lineWidth = 1;
  roundRect(c, x, y, w, h, Math.min(3, h * 0.12));
  c.stroke();
}

/* ---------------- Pitch constants (world units) ---------------- */
const PW = 880, PH = 540;          // pitch size
const GOAL_W = 150, GOAL_D = 34;   // goal mouth width / net depth
const POST_R = 4;
const CY = PH / 2;
const BOX_W = 132, BOX_H = 300;    // penalty area
const SIX_W = 52, SIX_H = 160;     // goal area
const HALF_LEN = 60;               // real seconds per half (displayed as 45')
const TILT = 0.80;                 // vertical foreshortening — fakes a tilted camera (2.5D)

/* ---------------- Canvas / view ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const view = { s: 1, ox: 0, oy: 0 };

// Pseudo-3D projection: world (x,y) -> screen. Y is foreshortened by TILT and the
// physics stays in flat world space; only rendering tilts, so gameplay is unchanged.
function projX(wx) { return view.ox + wx * view.s; }
function projY(wy) { return view.oy + wy * view.s * TILT; }
function depthAt(wy) { return 0.9 + 0.18 * (wy / PH); }   // nearer (lower) objects a touch bigger
function shade(hex, amt) {                                 // amt>0 lighten, <0 darken
  const c = hexRGB(hex), t = Math.abs(amt), to = amt < 0 ? 0 : 255;
  return 'rgb(' + Math.round(lerp(c[0], to, t)) + ',' + Math.round(lerp(c[1], to, t)) + ',' + Math.round(lerp(c[2], to, t)) + ')';
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Fit whole pitch, leaving room for HUD (top) and touch controls (bottom).
  const landscape = W > H;
  const padX = 24, padTop = landscape ? 52 : 46, padBot = landscape ? 30 : 46;
  const avail = H - padTop - padBot;
  view.s = Math.min((W - padX * 2) / (PW + GOAL_D * 2 + 16), avail / ((PH + 24) * TILT));
  view.ox = (W - PW * view.s) / 2;
  view.oy = padTop + (avail - PH * view.s * TILT) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));
resize();

/* ---------------- Sound (tiny WebAudio synth) ---------------- */
const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch (e) { /* audio unavailable */ }
  },
  blip(freq, dur, type, gain, delay = 0, slide = 0) {
    if (!this.ctx || this.ctx.state === 'suspended' && this.ctx.resume()) { }
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* ignore */ }
  },
  kick()    { this.blip(160, 0.09, 'triangle', 0.20, 0, -90); },
  bounce()  { this.blip(220, 0.05, 'sine', 0.08); },
  whistle(n = 1) { for (let i = 0; i < n; i++) this.blip(2350, 0.28, 'square', 0.035, i * 0.34); },
  goal() {
    [523, 659, 784, 1046].forEach((f, i) => this.blip(f, 0.30, 'triangle', 0.14, i * 0.09));
  },
  tap() { this.blip(660, 0.06, 'sine', 0.08); },
  champ() {
    [392, 523, 659, 784, 1046, 1318].forEach((f, i) => this.blip(f, 0.4, 'triangle', 0.12, i * 0.14));
  },
};

/* ---------------- Particles ---------------- */
const parts = [];
const CONF_COLORS = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb', '#ffffff', '#ff9100'];
function burstConfetti(x, y, n, screenSpace, spreadX = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(60, 320);
    parts.push({
      x: x + rand(-24, 24) * spreadX, y: y + rand(-10, 10),
      vx: Math.cos(a) * sp * spreadX, vy: Math.sin(a) * sp - rand(60, 220),
      rot: rand(0, TAU), vr: rand(-9, 9),
      w: rand(4, 8), h: rand(2.5, 5),
      col: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
      life: rand(1.4, 2.8), t: 0, scr: screenSpace,
    });
  }
}
function rainConfetti(n) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x: rand(0, W), y: rand(-40, -5),
      vx: rand(-30, 30), vy: rand(70, 190),
      rot: rand(0, TAU), vr: rand(-7, 7),
      w: rand(5, 9), h: rand(3, 6),
      col: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
      life: rand(3, 5), t: 0, scr: true,
    });
  }
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t > p.life) { parts.splice(i, 1); continue; }
    p.vy += (p.scr ? 260 : 420) * dt;
    p.vx *= Math.pow(0.4, dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawParticles(c, screenSpace) {
  for (const p of parts) {
    if (!!p.scr !== screenSpace) continue;
    const a = clamp((p.life - p.t) / 0.6, 0, 1);
    c.save();
    c.globalAlpha = a;
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.fillStyle = p.col;
    c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + 0.6 * Math.abs(Math.sin(p.rot * 2))));
    c.restore();
  }
  c.globalAlpha = 1;
}

/* ---------------- Game state machine ---------------- */
const ST = { MENU: 0, SELECT: 1, BRACKET: 2, MATCH: 3, CHAMPION: 4, ELIMINATED: 5 };
let state = ST.MENU;
let stateTime = 0;         // seconds in current state (blocks accidental double-taps)
let gTime = 0;             // global time for ambient animation
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

function setState(s) { state = s; stateTime = 0; uiHits.length = 0; }

/* ---------------- Tournament ---------------- */
let tour = null;
function newTournament(playerIdx) {
  // Fixed seeded bracket in TEAMS order: ARG-KSA, FRA-JPN, BRA-GER, ESP-ENG.
  const mk = (a, b) => ({ a, b, sa: null, sb: null, w: null, et: false });
  tour = {
    player: playerIdx,
    round: 0,
    rounds: [
      [mk(0, 1), mk(2, 3), mk(4, 5), mk(6, 7)],
      [mk(null, null), mk(null, null)],
      [mk(null, null)],
    ],
    champion: null,
    playerAlive: true,
  };
}
function simulateMatch(m) {
  const A = TEAMS[m.a], B = TEAMS[m.b];
  const ratio = A.str / B.str;
  m.sa = poisson(1.35 * ratio);
  m.sb = poisson(1.35 / ratio);
  if (m.sa === m.sb) { // knockout: golden goal decides
    m.et = true;
    if (Math.random() < ratio / (ratio + 1 / ratio)) m.sa++; else m.sb++;
  }
  m.w = m.sa > m.sb ? m.a : m.b;
}
function playerMatch() {
  if (!tour || tour.round > 2) return null;
  for (const m of tour.rounds[tour.round]) {
    if (m.w === null && (m.a === tour.player || m.b === tour.player)) return m;
  }
  return null;
}
function advanceRound() {
  const r = tour.round;
  for (const m of tour.rounds[r]) if (m.w === null) simulateMatch(m);
  if (r < 2) {
    const w = tour.rounds[r].map(m => m.w);
    if (r === 0) {
      tour.rounds[1][0].a = w[0]; tour.rounds[1][0].b = w[1];
      tour.rounds[1][1].a = w[2]; tour.rounds[1][1].b = w[3];
    } else {
      tour.rounds[2][0].a = w[0]; tour.rounds[2][0].b = w[1];
    }
    tour.round = r + 1;
  } else {
    tour.champion = tour.rounds[2][0].w;
  }
}
function finishPlayerMatch(m, sa, sb, et) {
  m.sa = sa; m.sb = sb; m.et = et;
  m.w = sa > sb ? m.a : m.b;
  const won = m.w === tour.player;
  const wasFinal = tour.round === 2;
  advanceRound();
  if (!won) {
    tour.playerAlive = false;
    // Play the rest of the tournament out so the bracket completes.
    while (tour.champion === null) advanceRound();
    setState(ST.ELIMINATED);
  } else if (wasFinal) {
    setState(ST.CHAMPION);
    Sound.champ();
  } else {
    setState(ST.BRACKET);
  }
}

/* ---------------- Input ---------------- */
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0 };
const btnPass = { id: null, x: 0, y: 0, r: 42, label: 'PASS' };
const btnShoot = { id: null, x: 0, y: 0, r: 50, label: 'SHOOT' };
const keys = {};
let shootCharge = -1;      // -1 idle, >=0 charging (seconds)
let passQueued = false;
const uiHits = [];         // clickable rects for menu screens

function layoutButtons() {
  btnShoot.x = W - 74; btnShoot.y = H - 148;
  btnPass.x = W - 168; btnPass.y = H - 62;
  if (H < 380) { // very short landscape phones
    btnShoot.x = W - 70; btnShoot.y = H - 118;
    btnPass.x = W - 172; btnPass.y = H - 54;
  }
}
function inBtn(b, x, y) { return dist(x, y, b.x, b.y) < b.r + 14; }

function pointerDown(x, y, id) {
  Sound.init();
  if (state !== ST.MATCH || (match && 'fulltime paused'.includes(match.phase))) {
    handleTap(x, y);
    return;
  }
  layoutButtons();
  if (inBtn(btnShoot, x, y) && btnShoot.id === null) {
    btnShoot.id = id;
    shootCharge = 0;
  } else if (inBtn(btnPass, x, y) && btnPass.id === null) {
    btnPass.id = id;
    passQueued = true;
  } else if (x < W * 0.55 && stick.id === null) {
    stick.id = id;
    stick.ox = x; stick.oy = clamp(y, 80, H - 80);
    stick.x = x; stick.y = y;
  }
}
function pointerMove(x, y, id) {
  if (id === stick.id) {
    stick.x = x; stick.y = y;
    let dx = x - stick.ox, dy = y - stick.oy;
    const l = Math.hypot(dx, dy), max = 52;
    if (l > max) {
      // Drag the joystick base along so direction flips feel instant.
      stick.ox = x - dx / l * max;
      stick.oy = y - dy / l * max;
      dx = dx / l * max; dy = dy / l * max;
    }
    stick.mag = clamp(l / max, 0, 1);
    const n = norm(dx, dy);
    stick.dx = n.x * (l > 4 ? 1 : 0);
    stick.dy = n.y * (l > 4 ? 1 : 0);
  }
}
function pointerUp(id) {
  if (id === stick.id) { stick.id = null; stick.dx = stick.dy = stick.mag = 0; }
  if (id === btnPass.id) btnPass.id = null;
  if (id === btnShoot.id) {
    btnShoot.id = null;
    if (shootCharge >= 0 && match) match.shootRelease = true;
  }
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) pointerDown(t.clientX, t.clientY, t.identifier);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) pointerMove(t.clientX, t.clientY, t.identifier);
}, { passive: false });
const touchEnd = e => {
  e.preventDefault();
  for (const t of e.changedTouches) pointerUp(t.identifier);
};
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });

// Desktop fallback: mouse taps for UI, keyboard for the match.
canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY, 'mouse'));
canvas.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY, 'mouse'));
canvas.addEventListener('mouseup', () => pointerUp('mouse'));
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  Sound.init();
  if (state === ST.MATCH && match) {
    if (e.code === 'KeyX' || e.code === 'KeyK') passQueued = true;
    if ((e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyL') && shootCharge < 0) shootCharge = 0;
    if (e.code === 'Enter' && 'fulltime paused'.includes(match.phase)) handleTap(W / 2, H / 2);
  } else if (e.code === 'Enter' || e.code === 'Space') {
    handleTap(W / 2, H / 2);
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if ((e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyL') && shootCharge >= 0 && match) {
    match.shootRelease = true;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === ST.MATCH && match && match.phase === 'play') {
    match.phase = 'paused';
  }
});
function keyboardStick() {
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (dx || dy) {
    const n = norm(dx, dy);
    return { dx: n.x, dy: n.y, mag: 1 };
  }
  return null;
}

/* ---------------- Tap routing (menus) ---------------- */
function handleTap(x, y) {
  if (stateTime < 0.35) return; // debounce state transitions
  switch (state) {
    case ST.MENU:
      Sound.tap();
      setState(ST.SELECT);
      break;
    case ST.SELECT:
      for (const r of uiHits) {
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
          Sound.tap();
          newTournament(r.idx);
          setState(ST.BRACKET);
          return;
        }
      }
      break;
    case ST.BRACKET: {
      const m = playerMatch();
      if (m) {
        Sound.whistle();
        startMatch(m);
        setState(ST.MATCH);
      }
      break;
    }
    case ST.CHAMPION:
    case ST.ELIMINATED:
      Sound.tap();
      tour = null;
      setState(ST.MENU);
      break;
    case ST.MATCH:
      if (match) {
        if (match.phase === 'paused') { match.phase = 'play'; Sound.tap(); }
        else if (match.phase === 'fulltime' && match.phaseT > 0.6) {
          // match.home is always the player, who may sit in slot a or b of the tie.
          const pa = match.bm.a === tour.player;
          finishPlayerMatch(match.bm,
            pa ? match.home.score : match.away.score,
            pa ? match.away.score : match.home.score, match.et);
          match = null;
        }
      }
      break;
  }
}

/* ============================================================
   MATCH ENGINE
   Home team = the player, always attacks RIGHT (enemy goal x=PW).
   ============================================================ */
let match = null;

function makePlayer(team, role, bx, by) {
  return {
    team, role,
    x: bx, y: by, vx: 0, vy: 0, r: 12,
    baseX: bx, baseY: by,
    fx: team.dir, fy: 0,          // facing
    repossess: 0,                 // can't take the ball while > 0
    lunge: 0,                     // tackle speed boost timer
    aiT: rand(0, 0.2), tx: bx, ty: by,
    gkHold: 0,
    skin: ['#e8bd91', '#c68955', '#8d5a35', '#5d3a20'][(Math.random() * 4) | 0],
  };
}
function formation(dir) {
  // Anchor points for a team attacking in direction `dir` (+1 = right).
  const mx = x => dir === 1 ? x : PW - x;
  return [
    ['GK', mx(26), CY],
    ['DF', mx(PW * 0.24), PH * 0.30],
    ['DF', mx(PW * 0.24), PH * 0.70],
    ['FW', mx(PW * 0.60), PH * 0.32],
    ['FW', mx(PW * 0.60), PH * 0.68],
  ];
}
function jerseyFor(def, opponentCol, gkTaken) {
  let col = def.col;
  if (colorDist(col, opponentCol) < 110) col = def.alt;
  let gk = GK_COLORS.find(g => colorDist(g, col) > 110 && colorDist(g, opponentCol) > 110 && !gkTaken.includes(g));
  return { col, gk: gk || '#a855f7' };
}

function startMatch(bm) {
  const homeIdx = bm.a === tour.player ? bm.a : bm.b;
  const awayIdx = bm.a === tour.player ? bm.b : bm.a;
  const hDef = TEAMS[homeIdx], aDef = TEAMS[awayIdx];
  const gkTaken = [];
  const hj = jerseyFor(hDef, aDef.col, gkTaken); gkTaken.push(hj.gk);
  const aj = jerseyFor(aDef, hj.col, gkTaken);

  const home = { def: hDef, col: hj.col, gkCol: hj.gk, dir: 1, score: 0, user: true, players: [] };
  const away = { def: aDef, col: aj.col, gkCol: aj.gk, dir: -1, score: 0, user: false, players: [] };
  home.opp = away; away.opp = home;
  for (const [role, x, y] of formation(1)) home.players.push(makePlayer(home, role, x, y));
  for (const [role, x, y] of formation(-1)) away.players.push(makePlayer(away, role, x, y));

  match = {
    bm, home, away,
    ball: { x: PW / 2, y: CY, vx: 0, vy: 0, r: 7, owner: null, lastKicker: null, freeT: 0, passTo: null, roll: 0 },
    controlled: home.players[3],
    half: 1, t: 0, et: false,
    phase: 'kickoff', phaseT: 0,
    banner: null,            // {text, sub, t, dur}
    flash: 0,
    shootRelease: false,
    kickoffBy: Math.random() < 0.5 ? home : away,
    // AI gets slightly sharper each round + with team strength.
    aiSkill: clamp((aDef.str - 70) / 30 + tour.round * 0.12, 0.2, 1.15),
  };
  shootCharge = -1; passQueued = false;
  setKickoff();
  showBanner(ROUND_NAMES[tour.round], hDef.name + '  vs  ' + aDef.name, 1.6);
}
function showBanner(text, sub, dur) {
  match.banner = { text, sub, t: 0, dur };
}
function setKickoff() {
  const m = match, b = m.ball;
  for (const t of [m.home, m.away]) {
    for (const p of t.players) {
      p.x = p.baseX; p.y = p.baseY; p.vx = p.vy = 0;
      p.repossess = 0; p.lunge = 0; p.gkHold = 0;
      p.fx = t.dir; p.fy = 0;
    }
  }
  b.x = PW / 2; b.y = CY; b.vx = b.vy = 0;
  b.owner = null; b.passTo = null; b.freeT = 0; b.lastKicker = null;
  // Kicking-off team's first forward starts on the ball.
  const fw = m.kickoffBy.players[3];
  fw.x = PW / 2 - m.kickoffBy.dir * 26; fw.y = CY;
  m.phase = 'kickoff'; m.phaseT = 0;
  if (m.home === m.kickoffBy) m.controlled = fw;
}

/* ---------- possession helpers ---------- */
function giveBall(p) {
  const b = match.ball;
  b.owner = p; b.passTo = null;
  b.vx = b.vy = 0;
  if (p.role === 'GK') p.gkHold = 0.001;
  if (p.team.user) match.controlled = p;
}
function kickBall(p, dx, dy, speed) {
  const b = match.ball;
  const n = norm(dx, dy);
  b.owner = null;
  b.lastKicker = p;
  b.freeT = 0.30;
  b.vx = n.x * speed; b.vy = n.y * speed;
  p.gkHold = 0;
  p.repossess = 0.15;
  Sound.kick();
}

/* ---------- pass / shoot ---------- */
function bestPassTarget(p, aimX, aimY) {
  const team = p.team;
  let best = null, bestScore = -1e9;
  for (const m of team.players) {
    if (m === p) continue;
    const dx = m.x - p.x, dy = m.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 30) continue;
    const n = norm(dx, dy);
    let score = (n.x * aimX + n.y * aimY) * 2.2;             // direction intent
    score += (m.x - p.x) * team.dir / PW * 0.9;              // prefer forward
    score -= Math.abs(d - 220) / 500;                        // prefer medium range
    if (m.role === 'GK') score -= 1.6;
    if (isOffside(team, m, p.x)) score -= 1.4;               // avoid offside where possible
    // Penalise blocked lanes.
    for (const o of team.opp.players) {
      const t = clamp(((o.x - p.x) * dx + (o.y - p.y) * dy) / (d * d), 0, 1);
      const lx = p.x + dx * t, ly = p.y + dy * t;
      if (dist(o.x, o.y, lx, ly) < 26) score -= 0.9;
    }
    if (score > bestScore) { bestScore = score; best = m; }
  }
  return best;
}
// Launch speed so a ball under exponential friction covers distance d in time T.
// Must stay in sync with the rolling-friction retention used in ballPhysics.
const BALL_FRICTION = 0.62;
function launchSpeedFor(d, T) {
  return d * (-Math.log(BALL_FRICTION)) / (1 - Math.pow(BALL_FRICTION, T));
}
function doPass(p, aimX, aimY) {
  const mate = bestPassTarget(p, aimX, aimY);
  if (!mate) return;
  const d0 = dist(p.x, p.y, mate.x, mate.y);
  const T = clamp(d0 / 620, 0.3, 0.85);
  // Lead the receiver to where they'll be when the ball arrives.
  const tx = mate.x + mate.vx * T, ty = mate.y + mate.vy * T;
  const d = dist(p.x, p.y, tx, ty);
  if (isOffside(p.team, mate, p.x)) { callOffside(p.team, mate); return; }
  const speed = clamp(launchSpeedFor(d, T), 360, 780);
  kickBall(p, tx - p.x, ty - p.y, speed);
  match.ball.passTo = mate;
}
function callOffside(team, receiver) {
  const m = match, b = m.ball;
  b.owner = null; b.passTo = null; b.vx = b.vy = 0;
  b.x = clamp(receiver.x, 24, PW - 24); b.y = clamp(receiver.y, 24, PH - 24);
  b.freeT = 0; b.lastKicker = null;
  const def = team.opp;               // free kick to the defending side
  let taker = null, bd = 1e9;
  for (const q of def.players) {
    if (q.role === 'GK') continue;
    const d = dist(q.x, q.y, b.x, b.y);
    if (d < bd) { bd = d; taker = q; }
  }
  if (taker) { giveBall(taker); taker.repossess = 0; }
  showBanner('OFFSIDE', 'Free kick — ' + def.def.name, 1.5);
  Sound.whistle();
}
function doShoot(p, power, aimBias, err) {
  const gx = p.team.dir === 1 ? PW : 0;
  let gy = CY + aimBias * (GOAL_W / 2 - 14);
  gy += rand(-1, 1) * err * GOAL_W * 0.55;
  const speed = 470 + power * 340;
  kickBall(p, gx - p.x, gy - p.y, speed);
  match.ball.passTo = null;
}

/* ---------- user control ---------- */
function updateControlled() {
  const m = match, team = m.home, b = m.ball;
  // The keeper is always AI; the user only ever controls an outfield player.
  if (b.owner && b.owner.team === team && b.owner.role !== 'GK') { m.controlled = b.owner; return; }
  if (b.passTo && b.passTo.team === team && b.passTo.role !== 'GK' &&
      dist(b.x, b.y, b.passTo.x, b.passTo.y) < 100) {
    m.controlled = b.passTo; return;
  }
  let best = null, bd = 1e9;
  for (const p of team.players) {
    if (p.role === 'GK') continue;
    const d = dist(p.x, p.y, b.x, b.y);
    if (d < bd) { bd = d; best = p; }
  }
  if (!best) return;
  const cur = m.controlled;
  if (!cur || cur.team !== team || cur.role === 'GK') { m.controlled = best; return; }
  const cd = dist(cur.x, cur.y, b.x, b.y);
  if (bd < cd * 0.72 - 6) m.controlled = best;
}

function userActions(dt) {
  const m = match, p = m.controlled, b = m.ball;
  const ks = keyboardStick();
  const jx = ks ? ks.dx : stick.dx, jy = ks ? ks.dy : stick.dy;
  const hasAim = Math.hypot(jx, jy) > 0.3;
  const owner = b.owner === p;

  if (shootCharge >= 0) shootCharge = Math.min(shootCharge + dt / 0.7, 1);

  if (passQueued) {
    passQueued = false;
    if (owner) {
      doPass(p, hasAim ? jx : p.fx, hasAim ? jy : p.fy);
    } else {
      // No ball: manual switch to the player nearest the ball.
      let best = null, bd = 1e9;
      for (const q of m.home.players) {
        if (q === p) continue;
        const d = dist(q.x, q.y, b.x, b.y);
        if (d < bd) { bd = d; best = q; }
      }
      if (best) m.controlled = best;
    }
  }
  if (m.shootRelease) {
    m.shootRelease = false;
    const charge = Math.max(shootCharge, 0.15);
    shootCharge = -1;
    if (owner) {
      doShoot(p, 0.35 + charge * 0.65, hasAim ? jy : 0, 0.06);
    } else {
      // Defensive lunge toward the ball.
      p.lunge = 0.28;
    }
  }
}

/* ---------- AI ---------- */
function anchor(p) {
  // Formation anchor pulled toward the ball.
  const b = match.ball;
  const pull = p.role === 'GK' ? 0.04 : p.role === 'DF' ? 0.34 : 0.46;
  const py = p.role === 'GK' ? 0 : p.role === 'DF' ? 0.35 : 0.42;
  return {
    x: clamp(p.baseX + (b.x - PW / 2) * pull, 20, PW - 20),
    y: clamp(p.baseY + (b.y - p.baseY) * py, 20, PH - 20),
  };
}
function nearestToBall(team, exclude) {
  const b = match.ball;
  let best = null, bd = 1e9;
  for (const p of team.players) {
    if (p === exclude || p.role === 'GK') continue;
    const d = dist(p.x, p.y, b.x, b.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
// X of the second-last opponent — the offside line for `team` (which attacks toward team.dir).
function offsideLineX(team) {
  const xs = team.opp.players.map(o => o.x);
  xs.sort((a, c) => team.dir === 1 ? c - a : a - c); // deepest (goal-side) first
  return xs.length > 1 ? xs[1] : xs[0];
}
// Is `receiver` in an offside position for a pass played from ballX?
function isOffside(team, receiver, ballX) {
  const mid = PW / 2;
  const inOppHalf = team.dir === 1 ? receiver.x > mid : receiver.x < mid;
  if (!inOppHalf) return false;
  const aheadOfBall = team.dir === 1 ? receiver.x > ballX + 2 : receiver.x < ballX - 2;
  if (!aheadOfBall) return false;
  const line = offsideLineX(team);
  const MARGIN = 12; // leniency
  return team.dir === 1 ? receiver.x > line + MARGIN : receiver.x < line - MARGIN;
}
function gkThink(p) {
  const b = match.ball, own = p.team.dir === 1 ? 0 : PW;
  const strong = p.team.user;                    // the user's keeper is a touch sharper
  const dBall = Math.abs(b.x - own);
  const inBox = dBall < BOX_W && Math.abs(b.y - CY) < BOX_H / 2;
  if (inBox && !b.owner && dBall < 150) {
    p.tx = b.x; p.ty = b.y;                       // rush out and claim a loose ball
    return;
  }
  const advance = dBall < 260 ? (strong ? 42 : 28) : 16;   // narrow the angle when threatened
  p.tx = own + p.team.dir * advance;
  p.ty = clamp(CY + (b.y - CY) * (strong ? 0.86 : 0.72), CY - GOAL_W / 2 + 10, CY + GOAL_W / 2 - 10);
}
function aiThink(p, dt) {
  p.aiT -= dt;
  if (p.aiT > 0) return;
  p.aiT = rand(0.12, 0.26);

  const m = match, b = m.ball, team = p.team, skill = team.user ? 0.7 : m.aiSkill;
  if (p.role === 'GK') { gkThink(p); return; }

  const owner = b.owner;
  const weHaveBall = owner && owner.team === team;
  const oppHasBall = owner && owner.team !== team;

  if (owner === p) {
    if (team.user) return; // dribbling direction handled by the user
    // --- enemy on the ball ---
    const gx = team.dir === 1 ? PW : 0;
    const dGoal = dist(p.x, p.y, gx, CY);
    let pressure = 1e9;
    for (const o of team.opp.players) pressure = Math.min(pressure, dist(o.x, o.y, p.x, p.y));
    const shootRange = 240 + skill * 90;
    if (dGoal < shootRange && (Math.random() < 0.4 + skill * 0.3 || dGoal < 150)) {
      doShoot(p, rand(0.7, 1), rand(-0.9, 0.9), 0.32 - skill * 0.16);
      return;
    }
    if (pressure < 62 && Math.random() < 0.75) {
      const aim = norm(gx - p.x, CY - p.y);
      doPass(p, aim.x, aim.y);
      return;
    }
    // Dribble toward goal, steering around the nearest opponent.
    let sx = gx - p.x, sy = CY * 0.4 + p.y * 0.6 - p.y;
    for (const o of team.opp.players) {
      const d = dist(o.x, o.y, p.x, p.y);
      if (d < 90) {
        const away = norm(p.x - o.x, p.y - o.y);
        sx += away.x * (90 - d) * 2.4;
        sy += away.y * (90 - d) * 2.4;
      }
    }
    const n = norm(sx, sy);
    p.tx = p.x + n.x * 90; p.ty = clamp(p.y + n.y * 90, 24, PH - 24);
    return;
  }

  // --- receiving a pass: move onto the ball's path to collect it ---
  if (b.passTo === p) { p.tx = b.x + b.vx * 0.3; p.ty = b.y + b.vy * 0.3; return; }

  const own = team.dir === 1 ? 0 : PW;
  const gx = team.dir === 1 ? PW : 0;
  const primary = nearestToBall(team, null);
  const secondary = nearestToBall(team, primary);
  // When the user drives the nearest man, the AI presses with the next man instead.
  const userOnPrimary = team.user && m.controlled === primary;

  if (!weHaveBall) {
    // ---------- DEFENDING: press hard, then hold a spread block ----------
    const iPress = (p === primary && !userOnPrimary);
    const iSupport = (p === secondary && (userOnPrimary || oppHasBall)) && !(team.user && p === m.controlled);
    if (iPress) {
      p.tx = b.x + b.vx * 0.16; p.ty = b.y + b.vy * 0.16;     // chase the ball down
      return;
    }
    if (iSupport && dist(p.x, p.y, b.x, b.y) < 280) {
      const n = norm(own - b.x, CY - b.y);                    // close in from the goal side
      p.tx = b.x + n.x * 52; p.ty = clamp(b.y + n.y * 52, 24, PH - 24);
      return;
    }
    // Everyone else: hold shape between the ball and our goal, keeping width.
    const depth = p.role === 'DF' ? 0.30 : 0.52;              // defenders sit deeper
    const side = p.baseY < CY ? -1 : (p.baseY > CY ? 1 : 0);
    p.tx = clamp(lerp(own, b.x, depth), 34, PW - 34);
    p.ty = clamp(lerp(p.baseY, b.y, 0.32) + side * 18, 34, PH - 34);
    return;
  }

  // ---------- ATTACKING: spread out and offer options ----------
  const line = offsideLineX(team);                            // stay onside behind this
  if (p.role === 'FW') {
    // Push high and wide but hover just behind the last line, not offside.
    let tx = gx - team.dir * 70;
    if (team.dir === 1) tx = Math.min(tx, line + 6);
    else tx = Math.max(tx, line - 6);
    p.tx = clamp(tx, 34, PW - 34);
    const wide = p.baseY < CY ? -1 : 1;
    p.ty = clamp(p.baseY + wide * 24 + (b.y - CY) * 0.22, 40, PH - 40);
    return;
  }
  // Defenders support from behind: hold width, give a safe back-pass option.
  p.tx = clamp(lerp(p.baseX, b.x, 0.38), 40, PW - 40);
  p.ty = clamp(p.baseY + (b.y - CY) * 0.2, 40, PH - 40);
}

/* ---------- physics ---------- */
function movePlayers(dt) {
  const m = match;
  const all = m.home.players.concat(m.away.players);
  const ks = keyboardStick();
  const jx = ks ? ks.dx : stick.dx, jy = ks ? ks.dy : stick.dy;
  const jmag = ks ? ks.mag : stick.mag;

  for (const p of all) {
    p.repossess = Math.max(0, p.repossess - dt);
    p.lunge = Math.max(0, p.lunge - dt);
    if (p.gkHold > 0) p.gkHold += dt;

    let dvx = 0, dvy = 0, speed;
    const isCtl = p === m.controlled && p.team.user;
    if (isCtl && m.phase === 'play') {
      speed = 208 * (m.ball.owner === p ? 0.88 : 1) * (p.lunge > 0 ? 1.55 : 1);
      if (p.lunge > 0) {
        const n = norm(m.ball.x - p.x, m.ball.y - p.y);
        dvx = n.x * speed; dvy = n.y * speed;
      } else {
        dvx = jx * jmag * speed; dvy = jy * jmag * speed;
      }
    } else {
      const gkSpeed = p.team.user ? 205 : 182;
      speed = (p.role === 'GK' ? gkSpeed : 190) * (m.ball.owner === p ? 0.86 : 1);
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.hypot(dx, dy);
      const urg = clamp(d / 40, 0, 1);
      if (d > 3) { dvx = dx / d * speed * urg; dvy = dy / d * speed * urg; }
    }
    const k = damp(9, dt);
    p.vx += (dvx - p.vx) * k;
    p.vy += (dvy - p.vy) * k;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, -GOAL_D + p.r, PW + GOAL_D - p.r);
    p.y = clamp(p.y, p.r, PH - p.r);
    if (Math.hypot(p.vx, p.vy) > 26) {
      const f = norm(p.vx, p.vy);
      p.fx = f.x; p.fy = f.y;
    }
  }
  // Separate overlapping players.
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      const a = all[i], b = all[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d < min && d > 1e-4) {
        const push = (min - d) / 2, nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }
}

function ballPhysics(dt) {
  const m = match, b = m.ball;
  b.freeT = Math.max(0, b.freeT - dt);

  if (b.owner) {
    const p = b.owner;
    // Auto-punt when a keeper has held it long enough.
    if (p.role === 'GK' && p.gkHold > (p.team.user ? 1.5 : 0.9)) {
      const mate = p.team.players[Math.random() < 0.5 ? 3 : 4];
      kickBall(p, mate.x - p.x + rand(-30, 30), mate.y - p.y + rand(-20, 20), 560);
      b.passTo = mate;
      return;
    }
    const tx = p.x + p.fx * (p.r + b.r + 2);
    const ty = p.y + p.fy * (p.r + b.r + 2);
    const k = damp(16, dt);
    b.x += (tx - b.x) * k; b.y += (ty - b.y) * k;
    b.vx = p.vx; b.vy = p.vy;
    b.roll += Math.hypot(p.vx, p.vy) * dt / b.r;
    // Tackles: opponent contact pokes the ball loose (keepers are protected).
    if (p.gkHold <= 0) {
      for (const o of p.team.opp.players) {
        if (o.repossess > 0) continue;
        if (dist(o.x, o.y, b.x, b.y) < o.r + b.r + 3 || (o.lunge > 0 && dist(o.x, o.y, b.x, b.y) < o.r + b.r + 9)) {
          b.owner = null;
          b.vx = o.vx * 0.6 + rand(-70, 70);
          b.vy = o.vy * 0.6 + rand(-70, 70);
          p.repossess = 0.45;
          o.repossess = 0.12;
          b.freeT = 0.04; b.lastKicker = null;
          Sound.bounce();
          break;
        }
      }
    }
  } else {
    b.x += b.vx * dt; b.y += b.vy * dt;
    const f = Math.pow(0.62, dt); // rolling friction (lighter, so passes carry)
    b.vx *= f; b.vy *= f;
    b.roll += Math.hypot(b.vx, b.vy) * dt / b.r;
  }

  const topPost = CY - GOAL_W / 2, botPost = CY + GOAL_W / 2;
  const inMouth = b.y > topPost && b.y < botPost;

  // Side walls (with goal pockets).
  if (!inMouth || b.owner) {
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.62; Sound.bounce(); }
    if (b.x > PW - b.r) { b.x = PW - b.r; b.vx = -Math.abs(b.vx) * 0.62; Sound.bounce(); }
  } else {
    // Net back walls.
    if (b.x < -GOAL_D + b.r) { b.x = -GOAL_D + b.r; b.vx = Math.abs(b.vx) * 0.3; }
    if (b.x > PW + GOAL_D - b.r) { b.x = PW + GOAL_D - b.r; b.vx = -Math.abs(b.vx) * 0.3; }
  }
  if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.62; Sound.bounce(); }
  if (b.y > PH - b.r) { b.y = PH - b.r; b.vy = -Math.abs(b.vy) * 0.62; Sound.bounce(); }

  // Goal posts.
  for (const gx of [0, PW]) {
    for (const gy of [topPost, botPost]) {
      const dx = b.x - gx, dy = b.y - gy;
      const d = Math.hypot(dx, dy), min = POST_R + b.r;
      if (d < min && d > 1e-4) {
        const nx = dx / d, ny = dy / d;
        b.x = gx + nx * min; b.y = gy + ny * min;
        const dot = b.vx * nx + b.vy * ny;
        if (dot < 0) { b.vx -= 1.7 * dot * nx; b.vy -= 1.7 * dot * ny; Sound.bounce(); }
      }
    }
  }

  // Goals.
  if (!b.owner && m.phase === 'play') {
    if (b.x < -b.r - 2 && inMouth) return scoreGoal(m.away);
    if (b.x > PW + b.r + 2 && inMouth) return scoreGoal(m.home);
  }

  // Picking up a loose ball.
  if (!b.owner && m.phase === 'play') {
    let taker = null, bd = 1e9;
    const all = m.home.players.concat(m.away.players);
    for (const p of all) {
      if (p.repossess > 0) continue;
      if (b.freeT > 0 && p === b.lastKicker) continue;
      const d = dist(p.x, p.y, b.x, b.y);
      let reach = p.r + b.r + (p.lunge > 0 ? 9 : 3);
      if (p.role === 'GK') reach += p.team.user ? 15 : 8;  // keepers have long arms; yours reach further
      if (d < reach && d < bd) { bd = d; taker = p; }
    }
    if (taker) {
      const speed = Math.hypot(b.vx, b.vy);
      const fumbleP = taker.team.user ? 0.12 : 0.4;         // your keeper spills far fewer shots
      if (taker.role === 'GK' && speed > 560 && Math.random() < fumbleP) {
        // Fumbled save: parry the shot away.
        const n = norm(b.x - taker.x, b.y - taker.y);
        b.vx = n.x * speed * 0.5 + rand(-90, 90);
        b.vy = n.y * speed * 0.5 + rand(-140, 140);
        taker.repossess = 0.3;
        Sound.bounce();
      } else {
        giveBall(taker);
      }
    }
  }
}

function scoreGoal(team) {
  const m = match;
  team.score++;
  m.phase = 'goal'; m.phaseT = 0;
  m.flash = 1;
  m.kickoffBy = team.opp;
  const gx = team.dir === 1 ? PW : 0;
  burstConfetti(projX(gx), projY(CY), 130, true);
  showBanner('GOAL!', team.def.name + (team.user ? '  —  YOU SCORE!' : ' score'), 2.4);
  Sound.goal();
}

/* ---------- match clock / flow ---------- */
function updateMatch(dt) {
  const m = match;
  m.phaseT += dt;
  m.flash = Math.max(0, m.flash - dt * 1.6);
  if (m.banner) { m.banner.t += dt; if (m.banner.t > m.banner.dur) m.banner = null; }

  switch (m.phase) {
    case 'kickoff':
      if (m.phaseT > 1.1) { m.phase = 'play'; m.phaseT = 0; Sound.whistle(); }
      break;
    case 'play': {
      m.t += dt;
      updateControlled();
      userActions(dt);
      const all = m.home.players.concat(m.away.players);
      for (const p of all) aiThink(p, dt);
      movePlayers(dt);
      ballPhysics(dt);
      // Clock milestones.
      if (!m.et) {
        if (m.half === 1 && m.t >= HALF_LEN) {
          m.half = 2; m.phase = 'halftime'; m.phaseT = 0;
          showBanner('HALF-TIME', scoreLine(m), 2.0);
          Sound.whistle(2);
        } else if (m.half === 2 && m.t >= HALF_LEN * 2) {
          if (m.home.score !== m.away.score) {
            endMatch();
          } else {
            m.et = true; m.phase = 'ggintro'; m.phaseT = 0;
            showBanner('GOLDEN GOAL', 'Next goal wins the tie!', 2.2);
            Sound.whistle(2);
          }
        }
      }
      break;
    }
    case 'goal':
      if (m.phaseT > 2.4) {
        if (m.et) endMatch();
        else setKickoff();
      }
      break;
    case 'halftime':
      if (m.phaseT > 2.0) { m.kickoffBy = m.kickoffBy.opp || m.away; setKickoff(); }
      break;
    case 'ggintro':
      if (m.phaseT > 2.0) setKickoff();
      break;
    case 'fulltime':
    case 'paused':
      break;
  }
}
function endMatch() {
  const m = match;
  m.phase = 'fulltime'; m.phaseT = 0;
  m.banner = null;
  Sound.whistle(3);
  if (m.home.score > m.away.score) burstConfetti(W / 2, H * 0.3, 90, true, 3);
}
function scoreLine(m) {
  return m.home.def.code + ' ' + m.home.score + ' - ' + m.away.score + ' ' + m.away.def.code;
}
function clockText(m) {
  if (m.et) return 'ET';
  const mins = Math.min(90, Math.floor(m.t / HALF_LEN * 45));
  return mins + "'";
}

/* ============================================================
   RENDERING
   ============================================================ */
function drawBackdrop(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1f14');
  g.addColorStop(1, '#060f0a');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
  // Faint crowd texture.
  c.save();
  c.globalAlpha = 0.05;
  for (let i = 0; i < 60; i++) {
    const x = (i * 137.5 + gTime * 2) % W;
    const y = (i * 71.3) % (H * 0.2);
    c.fillStyle = i % 2 ? '#ffffff' : '#8fd6a8';
    c.fillRect(x, y, 3, 3);
    c.fillRect(W - x, H - y - 4, 3, 3);
  }
  c.restore();
}

function drawPitch(c) {
  c.save();
  c.translate(view.ox, view.oy);
  c.scale(view.s, view.s * TILT);          // vertical tilt for the pseudo-3D camera

  // Grass apron + alternating stripes.
  const M = 18;
  c.fillStyle = '#2c8a3e';
  c.fillRect(-M - GOAL_D, -M, PW + 2 * M + 2 * GOAL_D, PH + 2 * M);
  const stripes = 12, sw = PW / stripes;
  for (let i = 0; i < stripes; i++) {
    c.fillStyle = i % 2 ? '#2f9343' : '#37a24d';
    c.fillRect(i * sw, -M, sw, PH + 2 * M);
  }
  // Mowing sheen.
  const sheen = c.createLinearGradient(0, 0, PW, PH);
  sheen.addColorStop(0, 'rgba(255,255,255,0.06)');
  sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.08)');
  c.fillStyle = sheen;
  c.fillRect(-M - GOAL_D, -M, PW + 2 * M + 2 * GOAL_D, PH + 2 * M);

  // Markings.
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 2.4;
  c.strokeRect(0, 0, PW, PH);
  c.beginPath(); c.moveTo(PW / 2, 0); c.lineTo(PW / 2, PH); c.stroke();
  c.beginPath(); c.arc(PW / 2, CY, 62, 0, TAU); c.stroke();
  c.beginPath(); c.arc(PW / 2, CY, 3.5, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill();
  for (const side of [0, 1]) {
    const x0 = side ? PW : 0, d = side ? -1 : 1;
    c.strokeRect(side ? PW - BOX_W : 0, CY - BOX_H / 2, BOX_W, BOX_H);
    c.strokeRect(side ? PW - SIX_W : 0, CY - SIX_H / 2, SIX_W, SIX_H);
    const spot = x0 + d * 92;
    c.beginPath(); c.arc(spot, CY, 2.6, 0, TAU); c.fill();
    c.beginPath();
    c.arc(spot, CY, 58, side ? Math.PI / 2 + 0.62 : -Math.PI / 2 + 0.62, side ? Math.PI * 1.5 - 0.62 : Math.PI / 2 - 0.62);
    c.stroke();
    // Corner arcs.
    c.beginPath(); c.arc(x0, 0, 9, side ? Math.PI / 2 : 0, side ? Math.PI : Math.PI / 2); c.stroke();
    c.beginPath(); c.arc(x0, PH, 9, side ? Math.PI : Math.PI * 1.5, side ? Math.PI * 1.5 : TAU); c.stroke();
  }

  // Goals with nets.
  for (const side of [0, 1]) {
    const gx = side ? PW : -GOAL_D;
    c.fillStyle = 'rgba(255,255,255,0.10)';
    c.fillRect(gx, CY - GOAL_W / 2, GOAL_D, GOAL_W);
    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = 0.8;
    for (let i = 1; i < 5; i++) {
      const nx = gx + GOAL_D * i / 5;
      c.beginPath(); c.moveTo(nx, CY - GOAL_W / 2); c.lineTo(nx, CY + GOAL_W / 2); c.stroke();
    }
    for (let i = 1; i < 10; i++) {
      const ny = CY - GOAL_W / 2 + GOAL_W * i / 10;
      c.beginPath(); c.moveTo(gx, ny); c.lineTo(gx + GOAL_D, ny); c.stroke();
    }
    c.strokeStyle = '#f2f2f2';
    c.lineWidth = 3;
    c.strokeRect(gx, CY - GOAL_W / 2, GOAL_D, GOAL_W);
    // Posts.
    c.fillStyle = '#ffffff';
    const px = side ? PW : 0;
    c.beginPath(); c.arc(px, CY - GOAL_W / 2, POST_R, 0, TAU); c.fill();
    c.beginPath(); c.arc(px, CY + GOAL_W / 2, POST_R, 0, TAU); c.fill();
  }
  c.restore();

  // Vignette.
  const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.42)');
  c.fillStyle = v;
  c.fillRect(0, 0, W, H);
}

// Standing 3D-styled figure, drawn in screen space at the player's projected feet.
function drawPlayer3D(c, p) {
  const ctl = match && p === match.controlled && p.team.user;
  const col = p.role === 'GK' ? p.team.gkCol : p.team.col;
  const ds = depthAt(p.y) * view.s, r = p.r * ds;
  const sx = projX(p.x), gy = projY(p.y);        // ground contact point
  const h = r * 1.7, topY = gy - h;

  // Grounded shadow (light from upper-left).
  c.fillStyle = 'rgba(0,0,0,0.26)';
  c.beginPath(); c.ellipse(sx + r * 0.35, gy + r * 0.10, r * 1.06, r * 0.5, 0, 0, TAU); c.fill();

  // Controlled ring on the grass.
  if (ctl) {
    c.strokeStyle = 'rgba(255,235,120,0.95)';
    c.lineWidth = 2.6;
    c.setLineDash([6, 4]); c.lineDashOffset = -gTime * 24;
    c.beginPath(); c.ellipse(sx, gy + r * 0.08, r * 1.28, r * 0.62, 0, 0, TAU); c.stroke();
    c.setLineDash([]);
  }

  // Body: shaded standing capsule (rect + rounded caps share one jersey gradient).
  const grad = c.createLinearGradient(sx - r, 0, sx + r, 0);
  grad.addColorStop(0, shade(col, -0.24));
  grad.addColorStop(0.42, shade(col, 0.18));
  grad.addColorStop(1, shade(col, -0.32));
  c.fillStyle = grad;
  c.fillRect(sx - r, topY, r * 2, h);
  c.beginPath(); c.ellipse(sx, gy, r, r * 0.5, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(sx, topY, r, r * 0.5, 0, 0, TAU); c.fill();
  // Vertical light sheen.
  const sheen = c.createLinearGradient(0, topY, 0, gy);
  sheen.addColorStop(0, 'rgba(255,255,255,0.20)');
  sheen.addColorStop(0.55, 'rgba(255,255,255,0)');
  c.fillStyle = sheen;
  c.fillRect(sx - r, topY, r * 2, h * 0.7);
  // Collar / trim band.
  c.strokeStyle = p.team.def.trim; c.lineWidth = Math.max(1.4, r * 0.22);
  c.beginPath(); c.ellipse(sx, topY + r * 0.16, r * 0.9, r * 0.44, 0, 0, TAU); c.stroke();

  // Head.
  const hx = sx + p.fx * r * 0.22, hy = topY - r * 0.5;
  const hg = c.createRadialGradient(hx - r * 0.18, hy - r * 0.2, r * 0.08, hx, hy, r * 0.62);
  hg.addColorStop(0, shade(p.skin, 0.25)); hg.addColorStop(1, shade(p.skin, -0.15));
  c.fillStyle = hg;
  c.beginPath(); c.arc(hx, hy, r * 0.5, 0, TAU); c.fill();

  // Shot power arc around the head.
  if (ctl && shootCharge >= 0) {
    c.strokeStyle = shootCharge > 0.85 ? '#ff5252' : '#ffd740';
    c.lineWidth = 3;
    c.beginPath(); c.arc(hx, hy, r * 0.95, -Math.PI / 2, -Math.PI / 2 + shootCharge * TAU); c.stroke();
  }
}

// Draw a soccer ball centred at screen (cx,cy).
function drawBallAt(c, cx, cy, r, roll) {
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 1; c.stroke();
  c.save();
  c.beginPath(); c.arc(cx, cy, r - 0.5, 0, TAU); c.clip();
  c.fillStyle = '#222';
  for (let i = 0; i < 3; i++) {
    const a = roll * 0.6 + i * TAU / 3;
    c.beginPath();
    c.arc(cx + Math.cos(a) * r * 0.62, cy + Math.sin(a) * r * 0.62, r * 0.30, 0, TAU);
    c.fill();
  }
  c.restore();
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.5, 'rgba(255,255,255,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
}
function drawBall3D(c, b) {
  const ds = depthAt(b.y) * view.s, r = b.r * ds;
  const sx = projX(b.x), gy = projY(b.y);
  const lift = r * 0.8;                             // ball floats above its shadow
  c.fillStyle = 'rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(sx + r * 0.3, gy + r * 0.1, r * 0.95, r * 0.5, 0, 0, TAU); c.fill();
  drawBallAt(c, sx, gy - lift, r, b.roll);
}

function drawHUD(c) {
  const m = match;
  const cw = 252, chh = 34, x = W / 2 - cw / 2, y = 8;
  c.save();
  c.fillStyle = 'rgba(6,14,10,0.78)';
  roundRect(c, x, y, cw, chh, 17);
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.12)';
  c.lineWidth = 1;
  c.stroke();
  drawFlag(c, m.home.def.code, x + 10, y + 8, 26, 18);
  drawFlag(c, m.away.def.code, x + cw - 36, y + 8, 26, 18);
  c.fillStyle = '#eafff2';
  c.font = '700 14px system-ui, sans-serif';
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(m.home.def.code, x + 42, y + chh / 2 + 1);
  c.textAlign = 'right';
  c.fillText(m.away.def.code, x + cw - 42, y + chh / 2 + 1);
  c.textAlign = 'center';
  c.font = '800 17px system-ui, sans-serif';
  c.fillText(m.home.score + ' - ' + m.away.score, x + cw / 2, y + chh / 2 + 1);
  // Clock pill.
  c.fillStyle = 'rgba(6,14,10,0.78)';
  roundRect(c, x + cw + 8, y + 3, 52, chh - 6, 14);
  c.fill();
  c.fillStyle = m.et ? '#ffd740' : '#7ce8a8';
  c.font = '700 13px system-ui, sans-serif';
  c.fillText(clockText(m), x + cw + 34, y + chh / 2 + 1);
  // Round label.
  c.fillStyle = 'rgba(6,14,10,0.78)';
  roundRect(c, x - 118, y + 3, 110, chh - 6, 14);
  c.fill();
  c.fillStyle = 'rgba(234,255,242,0.75)';
  c.font = '600 10px system-ui, sans-serif';
  c.fillText(ROUND_NAMES[tour ? tour.round : 0], x - 63, y + chh / 2 + 1);
  c.restore();
}

function drawControls(c) {
  c.save();
  layoutButtons();
  // Joystick.
  const sx = stick.id !== null ? stick.ox : 96;
  const sy = stick.id !== null ? stick.oy : H - 92;
  c.globalAlpha = stick.id !== null ? 0.55 : 0.28;
  c.fillStyle = '#dffbe9';
  c.beginPath(); c.arc(sx, sy, 54, 0, TAU); c.fill();
  c.globalAlpha = stick.id !== null ? 0.85 : 0.4;
  c.fillStyle = '#ffffff';
  const kx = sx + stick.dx * stick.mag * 40, ky = sy + stick.dy * stick.mag * 40;
  c.beginPath(); c.arc(stick.id !== null ? kx : sx, stick.id !== null ? ky : sy, 26, 0, TAU); c.fill();

  // Buttons.
  for (const b of [btnPass, btnShoot]) {
    const on = b.id !== null;
    c.globalAlpha = on ? 0.9 : 0.42;
    c.fillStyle = b === btnShoot ? '#ff7043' : '#4fc3f7';
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
    c.globalAlpha = on ? 1 : 0.75;
    c.strokeStyle = '#ffffff';
    c.lineWidth = 2;
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.stroke();
    c.fillStyle = '#ffffff';
    c.font = '800 ' + (b.r * 0.34) + 'px system-ui, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(b.label, b.x, b.y + 1);
  }
  c.restore();
}

function drawBanner(c) {
  const m = match;
  if (!m.banner) return;
  const b = m.banner;
  const inT = clamp(b.t / 0.28, 0, 1);
  const outT = clamp((b.dur - b.t) / 0.3, 0, 1);
  const s = (1 - Math.pow(1 - inT, 3)) * (0.6 + 0.4 * outT);
  c.save();
  c.globalAlpha = Math.min(inT * 1.4, outT * 1.4, 1);
  c.translate(W / 2, H * 0.34);
  c.scale(s, s);
  c.fillStyle = 'rgba(6,14,10,0.66)';
  roundRect(c, -230, -46, 460, 92, 20);
  c.fill();
  c.fillStyle = '#ffffff';
  c.font = '900 40px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(124,232,168,0.7)';
  c.shadowBlur = 18;
  c.fillText(b.text, 0, -10);
  c.shadowBlur = 0;
  c.fillStyle = 'rgba(234,255,242,0.85)';
  c.font = '600 16px system-ui, sans-serif';
  c.fillText(b.sub, 0, 26);
  c.restore();
}

function drawFullTime(c) {
  const m = match;
  c.fillStyle = 'rgba(4,10,7,0.72)';
  c.fillRect(0, 0, W, H);
  const won = m.home.score > m.away.score;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = won ? '#7ce8a8' : '#ff8a80';
  c.font = '900 34px system-ui, sans-serif';
  c.fillText(won ? 'VICTORY!' : 'FULL TIME', W / 2, H * 0.28);
  c.fillStyle = '#ffffff';
  c.font = '800 30px system-ui, sans-serif';
  drawFlag(c, m.home.def.code, W / 2 - 150, H * 0.44 - 16, 46, 32);
  drawFlag(c, m.away.def.code, W / 2 + 104, H * 0.44 - 16, 46, 32);
  c.fillText(m.home.score + '  -  ' + m.away.score, W / 2, H * 0.44);
  if (m.et) {
    c.fillStyle = '#ffd740';
    c.font = '600 14px system-ui, sans-serif';
    c.fillText('after golden goal', W / 2, H * 0.44 + 34);
  }
  blinkText(c, 'TAP TO CONTINUE', W / 2, H * 0.68);
}

function blinkText(c, txt, x, y) {
  c.save();
  c.globalAlpha = 0.55 + 0.45 * Math.sin(gTime * 4.4);
  c.fillStyle = '#eafff2';
  c.font = '700 15px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, x, y);
  c.restore();
}

function renderMatch(c) {
  drawBackdrop(c);
  drawPitch(c);
  const m = match;

  // Pass target hint (ring on the grass at the receiver's feet).
  if (m.ball.passTo && m.ball.passTo.team.user) {
    const t = m.ball.passTo, r = t.r * depthAt(t.y) * view.s;
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = 1.8;
    c.setLineDash([4, 5]);
    c.beginPath(); c.ellipse(projX(t.x), projY(t.y), r * 1.3, r * 0.62, 0, 0, TAU); c.stroke();
    c.setLineDash([]);
  }
  // Depth-sorted entities so nearer figures overlap farther ones.
  const ents = [];
  for (const p of m.home.players.concat(m.away.players)) ents.push({ y: p.y, p });
  ents.push({ y: m.ball.y + 0.5, ball: m.ball });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) { if (e.p) drawPlayer3D(c, e.p); else drawBall3D(c, e.ball); }
  // Controlled marker floating above the player.
  const cp = m.controlled;
  if (cp) {
    const sx = projX(cp.x), ds = depthAt(cp.y) * view.s;
    const ay = projY(cp.y) - cp.r * ds * 1.7 - cp.r * ds - 14 + Math.sin(gTime * 6) * 2;
    c.fillStyle = '#ffd740';
    c.beginPath();
    c.moveTo(sx, ay + 8); c.lineTo(sx - 7, ay); c.lineTo(sx + 7, ay);
    c.closePath(); c.fill();
  }

  drawParticles(c, true);
  if (m.flash > 0) {
    c.fillStyle = 'rgba(255,255,255,' + (m.flash * 0.35) + ')';
    c.fillRect(0, 0, W, H);
  }
  drawHUD(c);
  if (IS_TOUCH && 'play kickoff goal ggintro halftime'.includes(m.phase)) drawControls(c);
  drawBanner(c);
  if (m.phase === 'fulltime') drawFullTime(c);
  if (m.phase === 'paused') {
    c.fillStyle = 'rgba(4,10,7,0.7)';
    c.fillRect(0, 0, W, H);
    c.fillStyle = '#fff';
    c.font = '900 30px system-ui, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('PAUSED', W / 2, H * 0.42);
    blinkText(c, 'TAP TO RESUME', W / 2, H * 0.56);
  }
}

/* ---------------- Menu / select / bracket screens ---------------- */
function renderMenu(c) {
  drawBackdrop(c);
  drawPitch(c);
  c.fillStyle = 'rgba(4,10,7,0.68)';
  c.fillRect(0, 0, W, H);

  // Bouncing ball ornament.
  const bx = W / 2, bounce = Math.abs(Math.sin(gTime * 3.1)) * 34, by = H * 0.62 - bounce;
  c.fillStyle = 'rgba(0,0,0,0.3)';
  c.beginPath(); c.ellipse(bx, H * 0.62 + 16, 15 - bounce * 0.15, 5, 0, 0, TAU); c.fill();
  drawBallAt(c, bx, by, 15, gTime * 8);

  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.save();
  c.shadowColor = 'rgba(124,232,168,0.8)';
  c.shadowBlur = 26;
  c.fillStyle = '#ffffff';
  c.font = '900 ' + Math.min(58, W * 0.075) + 'px system-ui, sans-serif';
  c.fillText('ARCADE WORLD CUP', W / 2, H * 0.26);
  c.restore();
  c.fillStyle = '#7ce8a8';
  c.font = '700 16px system-ui, sans-serif';
  c.fillText('⚽  KNOCKOUT TOURNAMENT  ⚽', W / 2, H * 0.26 + 44);

  // Flag strip.
  const fw = 40, fh = 28, gap = 12;
  const total = TEAMS.length * fw + (TEAMS.length - 1) * gap;
  let fx = W / 2 - total / 2;
  for (const t of TEAMS) {
    drawFlag(c, t.code, fx, H * 0.44 - fh / 2, fw, fh);
    fx += fw + gap;
  }
  blinkText(c, 'TAP TO START', W / 2, H * 0.8);
  if (!IS_TOUCH) {
    c.fillStyle = 'rgba(234,255,242,0.45)';
    c.font = '500 12px system-ui, sans-serif';
    c.fillText('Desktop: WASD / arrows to move · X = pass · SPACE (hold) = shoot', W / 2, H * 0.9);
  }
}

function renderSelect(c) {
  drawBackdrop(c);
  drawPitch(c);
  c.fillStyle = 'rgba(4,10,7,0.72)';
  c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#ffffff';
  c.font = '900 26px system-ui, sans-serif';
  c.fillText('CHOOSE YOUR NATION', W / 2, H * 0.12);

  uiHits.length = 0;
  const cols = 4, rows = 2;
  const cw = Math.min(170, (W - 60) / cols - 12), chh = Math.min(96, (H * 0.62) / rows - 10);
  const gw = cols * cw + (cols - 1) * 14, gh = rows * chh + (rows - 1) * 14;
  const x0 = W / 2 - gw / 2, y0 = H * 0.22;
  for (let i = 0; i < TEAMS.length; i++) {
    const t = TEAMS[i];
    const x = x0 + (i % cols) * (cw + 14);
    const y = y0 + ((i / cols) | 0) * (chh + 14);
    const hover = Math.sin(gTime * 3 + i) * 1.5;
    c.fillStyle = 'rgba(255,255,255,0.07)';
    roundRect(c, x, y + hover, cw, chh, 12);
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.18)';
    c.lineWidth = 1.4;
    c.stroke();
    drawFlag(c, t.code, x + cw / 2 - 24, y + hover + 10, 48, 32);
    c.fillStyle = '#ffffff';
    c.font = '700 13px system-ui, sans-serif';
    c.fillText(t.name, x + cw / 2, y + hover + chh - 26);
    c.fillStyle = '#7ce8a8';
    c.font = '600 10px system-ui, sans-serif';
    c.fillText('★ ' + t.str, x + cw / 2, y + hover + chh - 11);
    uiHits.push({ x, y: y - 4, w: cw, h: chh + 8, idx: i });
  }
  blinkText(c, 'TAP A TEAM TO ENTER THE CUP', W / 2, y0 + gh + 34);
}

function drawMatchCard(c, m, x, y, w, h, highlight) {
  c.fillStyle = highlight ? 'rgba(124,232,168,0.16)' : 'rgba(255,255,255,0.06)';
  roundRect(c, x, y, w, h, 8);
  c.fill();
  c.strokeStyle = highlight ? '#7ce8a8' : 'rgba(255,255,255,0.15)';
  c.lineWidth = highlight ? 2 : 1;
  c.stroke();
  const row = (idx, ty) => {
    const teamIdx = idx === 0 ? m.a : m.b;
    const sc = idx === 0 ? m.sa : m.sb;
    if (teamIdx === null) {
      c.fillStyle = 'rgba(255,255,255,0.3)';
      c.font = '600 11px system-ui, sans-serif';
      c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText('— TBD —', x + 10, ty);
      return;
    }
    const t = TEAMS[teamIdx];
    const winner = m.w === teamIdx, loser = m.w !== null && !winner;
    drawFlag(c, t.code, x + 7, ty - 7, 20, 14);
    c.fillStyle = loser ? 'rgba(255,255,255,0.38)' : '#ffffff';
    c.font = (winner ? '800 ' : '600 ') + '12px system-ui, sans-serif';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(t.code + (teamIdx === (tour && tour.player) ? ' ★' : ''), x + 33, ty);
    c.textAlign = 'right';
    c.fillText(sc === null ? '' : String(sc), x + w - 9, ty);
  };
  row(0, y + h * 0.28);
  row(1, y + h * 0.72);
  c.strokeStyle = 'rgba(255,255,255,0.08)';
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x + 6, y + h / 2); c.lineTo(x + w - 6, y + h / 2); c.stroke();
}

function renderBracket(c, overlayText, overlayCol) {
  drawBackdrop(c);
  drawPitch(c);
  c.fillStyle = 'rgba(4,10,7,0.78)';
  c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#ffffff';
  c.font = '900 22px system-ui, sans-serif';
  c.fillText('WORLD CUP — KNOCKOUT BRACKET', W / 2, Math.max(26, H * 0.08));

  const cardW = Math.min(128, W * 0.19), cardH = 52;
  const cQF = W * 0.06, cSF = W * 0.33, cF = W * 0.60;
  const top = H * 0.16, bh = H * 0.72;
  const next = playerMatch();

  const pos = { qf: [], sf: [], f: [] };
  for (let i = 0; i < 4; i++) {
    const y = top + bh * (i + 0.5) / 4 - cardH / 2;
    pos.qf.push({ x: cQF, y });
  }
  for (let i = 0; i < 2; i++) {
    const y = top + bh * (i + 0.5) / 2 - cardH / 2;
    pos.sf.push({ x: cSF, y });
  }
  pos.f.push({ x: cF, y: top + bh / 2 - cardH / 2 });

  // Connectors.
  c.strokeStyle = 'rgba(255,255,255,0.18)';
  c.lineWidth = 1.5;
  const link = (a, b) => {
    c.beginPath();
    const midX = (a.x + cardW + b.x) / 2;
    c.moveTo(a.x + cardW, a.y + cardH / 2);
    c.lineTo(midX, a.y + cardH / 2);
    c.lineTo(midX, b.y + cardH / 2);
    c.lineTo(b.x, b.y + cardH / 2);
    c.stroke();
  };
  link(pos.qf[0], pos.sf[0]); link(pos.qf[1], pos.sf[0]);
  link(pos.qf[2], pos.sf[1]); link(pos.qf[3], pos.sf[1]);
  link(pos.sf[0], pos.f[0]); link(pos.sf[1], pos.f[0]);

  const r = tour.rounds;
  for (let i = 0; i < 4; i++) drawMatchCard(c, r[0][i], pos.qf[i].x, pos.qf[i].y, cardW, cardH, next === r[0][i]);
  for (let i = 0; i < 2; i++) drawMatchCard(c, r[1][i], pos.sf[i].x, pos.sf[i].y, cardW, cardH, next === r[1][i]);
  drawMatchCard(c, r[2][0], pos.f[0].x, pos.f[0].y, cardW, cardH, next === r[2][0]);

  // Champion slot.
  const chx = cF + cardW + W * 0.03, chy = top + bh / 2;
  c.font = '600 11px system-ui, sans-serif';
  c.fillStyle = 'rgba(255,215,64,0.9)';
  c.fillText('🏆 CHAMPION', chx + 52, chy - 30);
  c.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(c, chx, chy - 18, 104, 36, 8);
  c.fill();
  c.strokeStyle = tour.champion !== null ? '#ffd740' : 'rgba(255,255,255,0.15)';
  c.stroke();
  if (tour.champion !== null) {
    drawFlag(c, TEAMS[tour.champion].code, chx + 8, chy - 8, 22, 15);
    c.fillStyle = '#ffd740';
    c.font = '800 13px system-ui, sans-serif';
    c.textAlign = 'left';
    c.fillText(TEAMS[tour.champion].code, chx + 38, chy + 1);
    c.textAlign = 'center';
  }

  if (overlayText) {
    c.fillStyle = 'rgba(4,10,7,0.55)';
    c.fillRect(0, H * 0.36, W, H * 0.26);
    c.fillStyle = overlayCol;
    c.font = '900 34px system-ui, sans-serif';
    c.fillText(overlayText, W / 2, H * 0.46);
    blinkText(c, 'TAP FOR MAIN MENU', W / 2, H * 0.56);
  } else if (next) {
    const vs = TEAMS[next.a === tour.player ? next.b : next.a];
    blinkText(c, ROUND_NAMES[tour.round] + ' vs ' + vs.name.toUpperCase() + ' — TAP TO KICK OFF', W / 2, H * 0.94);
  }
}

function renderChampion(c) {
  drawBackdrop(c);
  c.fillStyle = 'rgba(4,10,7,0.5)';
  c.fillRect(0, 0, W, H);
  if (Math.random() < 0.25) rainConfetti(3);

  const t = TEAMS[tour.player];
  c.textAlign = 'center'; c.textBaseline = 'middle';

  // Trophy.
  const tx = W / 2, ty = H * 0.40, s = Math.min(H * 0.0038, 1.15);
  c.save();
  c.translate(tx, ty);
  c.scale(s, s);
  c.shadowColor = 'rgba(255,215,64,0.85)';
  c.shadowBlur = 34;
  c.fillStyle = '#ffd740';
  for (const hd of [-1, 1]) {          // handles (outer half-circles, drawn under the bowl)
    c.beginPath();
    c.arc(hd * 52, -50, 17, Math.PI / 2, Math.PI * 1.5, hd === 1);
    c.lineWidth = 9;
    c.strokeStyle = '#ffd740';
    c.stroke();
  }
  c.beginPath();                       // cup bowl
  c.moveTo(-46, -70);
  c.bezierCurveTo(-46, -10, -14, 8, 0, 8);
  c.bezierCurveTo(14, 8, 46, -10, 46, -70);
  c.closePath(); c.fill();
  c.fillRect(-7, 6, 14, 30);           // stem
  c.beginPath(); c.ellipse(0, 44, 34, 10, 0, 0, TAU); c.fill();  // base
  c.shadowBlur = 0;
  c.fillStyle = 'rgba(255,255,255,0.35)';
  c.beginPath(); c.ellipse(-18, -52, 8, 20, 0.3, 0, TAU); c.fill();
  c.restore();

  c.save();
  c.shadowColor = 'rgba(255,215,64,0.7)';
  c.shadowBlur = 20;
  c.fillStyle = '#ffffff';
  c.font = '900 ' + Math.min(44, W * 0.06) + 'px system-ui, sans-serif';
  c.fillText('WORLD CHAMPIONS!', W / 2, H * 0.66);
  c.restore();
  drawFlag(c, t.code, W / 2 - 74, H * 0.76 - 14, 42, 28);
  c.fillStyle = '#ffd740';
  c.font = '800 24px system-ui, sans-serif';
  c.textAlign = 'left';
  c.fillText(t.name, W / 2 - 22, H * 0.76);
  c.textAlign = 'center';
  blinkText(c, 'TAP TO PLAY AGAIN', W / 2, H * 0.9);
  drawParticles(c, true);
}

/* ---------------- Main loop ---------------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;  // clamp tab-switch spikes; stays smooth at any Hz
  gTime += dt;
  stateTime += dt;

  updateParticles(dt);
  if (state === ST.MATCH && match) updateMatch(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  switch (state) {
    case ST.MENU: renderMenu(ctx); break;
    case ST.SELECT: renderSelect(ctx); break;
    case ST.BRACKET: renderBracket(ctx, null); break;
    case ST.MATCH: if (match) renderMatch(ctx); break;
    case ST.CHAMPION: renderChampion(ctx); break;
    case ST.ELIMINATED: renderBracket(ctx, 'ELIMINATED', '#ff8a80'); break;
  }
  if (state !== ST.MATCH && state !== ST.CHAMPION) drawParticles(ctx, true);
}
requestAnimationFrame(frame);
</script>
